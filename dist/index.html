<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小八的国象之旅</title><style>
:root {
  --bg: #f5f3ee;
  --panel: #fff;
  --ink: #343b34;
  --muted: #7b8177;
  --line: #e7e6de;
  --green: #50765a;
  --soft: #edf3eb;
  --shadow: 0 6px 24px #3b49320a;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font:
    16px/1.6 system-ui,
    -apple-system,
    "PingFang SC",
    sans-serif;
}
body.dark {
  --bg: #252823;
  --panel: #32362f;
  --ink: #eceee6;
  --muted: #b0b6a8;
  --line: #464d40;
  --green: #88b38b;
  --soft: #3c4939;
}
button,
a,
select {
  -webkit-tap-highlight-color: transparent;
}
button,
select {
  font: inherit;
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 17px;
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
button:hover {
  background: var(--soft);
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button:focus-visible,
a:focus-visible,
select:focus-visible {
  outline: 3px solid #e9a543;
  outline-offset: 2px;
}
.primary {
  background: var(--green);
  color: white;
  border-color: transparent;
}
.primary:hover {
  filter: brightness(1.08);
  background: var(--green);
}
header {
  max-width: 1240px;
  margin: auto;
  padding: 24px 32px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--ink);
  font-size: 34px;
}
.brand span {
  font-size: 23px;
  font-weight: 750;
  letter-spacing: 1px;
}
.brand small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 2px;
  color: var(--muted);
}
header > div {
  display: flex;
  gap: 8px;
}
nav {
  max-width: 1176px;
  margin: 0 auto 26px;
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
nav button {
  border: 0;
  background: transparent;
  border-radius: 8px;
  min-width: 110px;
}
nav button.active {
  background: var(--soft);
  color: var(--green);
  font-weight: 700;
}
main {
  max-width: 1176px;
  margin: auto;
  min-height: 68vh;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--green);
  font-weight: 700;
}
h1 {
  font-size: 32px;
  line-height: 1.35;
  margin: 12px 0;
}
h2 {
  font-size: 22px;
  line-height: 1.4;
  margin: 0 0 12px;
}
p {
  margin: 8px 0;
  color: var(--muted);
}
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 0 28px;
}
.hero-art {
  font-size: 68px;
  padding: 0 42px;
  color: var(--green);
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat,
.card,
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: var(--shadow);
  padding: 22px;
}
.stat b {
  display: block;
  font-size: 29px;
  font-weight: 650;
  margin: 4px 0;
}
.stat span,
.sub {
  font-size: 13px;
  color: var(--muted);
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.card {
  position: relative;
}
.card .icon {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--soft);
  font-size: 25px;
  margin-bottom: 18px;
}
.card button {
  margin-top: 18px;
  width: 100%;
}
.card p {
  font-size: 14px;
  min-height: 45px;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 26px 0 14px;
}
.badges {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.badge {
  padding: 13px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.badge.locked {
  opacity: 0.5;
}
.play-layout {
  display: grid;
  grid-template-columns: minmax(384px, 660px) minmax(285px, 1fr);
  gap: 28px;
  align-items: start;
}
.board-wrap {
  width: 100%;
  max-width: 660px;
}
.player {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 2px;
  min-height: 48px;
  font-size: 14px;
}
.player b {
  font-size: 16px;
}
.board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: 100%;
  aspect-ratio: 1;
  box-shadow: 0 6px 22px #30271925;
  border-radius: 3px;
  overflow: hidden;
  outline: 0 solid #6a9e53;
  transition: outline 0.2s;
}
.board.success {
  outline: 6px solid #76a967;
}
.sq {
  position: relative;
  aspect-ratio: 1;
  min-width: 48px;
  min-height: 48px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: #f0d9b5;
  display: grid;
  place-items: center;
}
.sq.dark-square {
  background: #b58863;
}
.sq:hover {
  background: #e7c892;
}
.sq.last {
  background: #cdd26a;
}
.sq.selected {
  background: #a3b74a;
}
.sq.hint {
  box-shadow: inset 0 0 0 6px #5a9fd3;
}
.sq.check {
  background:
    radial-gradient(ellipse, #e44236 25%, #e4423688 50%, transparent 85%),
    #b58863;
}
.sq .piece {
  width: 88%;
  height: 88%;
  pointer-events: none;
  z-index: 1;
}
.sq .dot {
  position: absolute;
  width: 25%;
  height: 25%;
  border-radius: 50%;
  background: #2e392f35;
}
.sq .ring {
  position: absolute;
  inset: 5%;
  border: 5px solid #2e392f45;
  border-radius: 50%;
}
.coord {
  position: absolute;
  font-size: 11px;
  font-weight: 700;
  color: #654c37;
  line-height: 1;
  z-index: 2;
  pointer-events: none;
}
.file {
  right: 4px;
  bottom: 3px;
}
.rank {
  left: 3px;
  top: 4px;
}
.panel {
  padding: 24px;
}
.status {
  padding: 16px;
  background: var(--soft);
  border-radius: 10px;
  margin: 20px 0;
  color: var(--ink);
  min-height: 80px;
}
.status b {
  display: block;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.controls .wide {
  grid-column: 1/-1;
}
label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin: 16px 0 6px;
}
select {
  width: 100%;
}
.moves {
  font-variant-numeric: tabular-nums;
  max-height: 132px;
  overflow: auto;
  background: var(--bg);
  border-radius: 8px;
  padding: 10px;
  font-size: 14px;
  margin-top: 16px;
  word-spacing: 10px;
}
.progress {
  height: 8px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin: 18px 0;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--green);
}
.pill {
  display: inline-block;
  font-size: 12px;
  color: var(--green);
  background: var(--soft);
  padding: 4px 10px;
  border-radius: 20px;
}
.tip {
  font-size: 13px;
  margin-top: 18px;
}
footer {
  max-width: 1176px;
  margin: 40px auto 20px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px;
  background: var(--panel);
  color: var(--ink);
  max-width: 450px;
}
dialog::backdrop {
  background: #10191070;
}
#promoteChoices {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}
#promoteChoices .piece {
  width: 50px;
  height: 50px;
  display: block;
  pointer-events: none;
}
.practice-grid {
  grid-template-columns: repeat(2, 1fr);
}
.levels {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.levels button {
  min-width: 48px;
  padding: 9px;
}
@media (max-width: 1200px) {
  header,
  main,
  nav,
  footer {
    margin-left: 24px;
    margin-right: 24px;
  }
  header {
    padding-left: 0;
    padding-right: 0;
  }
  .play-layout {
    gap: 20px;
    grid-template-columns: minmax(384px, 1.5fr) minmax(280px, 1fr);
  }
}
@media (max-width: 740px) {
  header {
    flex-wrap: wrap;
    margin: 16px;
  }
  .brand span {
    font-size: 20px;
  }
  nav {
    overflow: auto;
    margin: 0 16px 20px;
  }
  nav button {
    min-width: 95px;
  }
  main {
    margin: 0 16px;
  }
  .play-layout {
    display: flex;
    flex-direction: column;
  }
  .board-wrap {
    min-width: 384px;
  }
  .panel {
    width: 100%;
  }
  .stats {
    grid-template-columns: 1fr 1fr;
  }
  .cards,
  .practice-grid {
    grid-template-columns: 1fr;
  }
  .hero-art {
    display: none;
  }
  footer {
    margin: 24px 16px;
    display: block;
  }
  .hero {
    padding-top: 0;
  }
  h1 {
    font-size: 28px;
  }
}

footer a {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  color: var(--green);
  padding: 0 8px;
}
/* Training calendar and history use the same calm panels as the chessboard. */
nav {
  overflow-x: auto;
  scrollbar-width: thin;
}
nav button {
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 100px;
}
.training-plan {
  margin-bottom: 30px;
}
.training-plan .section-head {
  margin-top: 0;
}
.plan-layout {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 20px;
  align-items: start;
}
.calendar {
  padding: 18px;
}
.weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(48px, 1fr));
  gap: 6px;
}
.weekdays span {
  text-align: center;
  color: var(--muted);
  padding: 6px;
}
.calendar-day {
  padding: 6px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  min-height: 80px;
  font-size: 13px;
}
.calendar-day small {
  font-size: 10px;
  color: var(--muted);
}
.calendar-day b {
  font-size: 20px;
  line-height: 1.2;
}
.calendar-day span {
  font-size: 10px;
}
.calendar-day.today {
  border: 2px solid var(--green);
}
.calendar-day.selected-day {
  background: var(--soft);
  box-shadow: inset 0 0 0 2px var(--green);
}
.calendar-day.complete {
  color: var(--green);
}
.checklist h2 {
  margin-top: 14px;
  font-size: 21px;
}
.task-list {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}
.task {
  display: flex;
  text-align: left;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 12px;
}
.task > span:nth-child(2) {
  flex: 1;
}
.task b {
  display: block;
  font-size: 15px;
}
.task small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}
.task-check {
  font-size: 25px;
  color: var(--muted);
}
.task.done {
  background: var(--soft);
}
.task.done .task-check {
  color: var(--green);
}
.lesson-grid,
.archive-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 26px;
}
.lesson-card {
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: start;
  text-align: left;
  gap: 12px;
  min-height: 180px;
}
.lesson-card b {
  font-size: 19px;
}
.lesson-card small {
  font-size: 13px;
  color: var(--muted);
}
.lesson-points {
  padding-left: 22px;
}
.lesson-points li {
  margin: 12px 0;
}
.plan-banner {
  padding: 8px 12px;
  background: var(--soft);
  border-radius: 10px;
  font-size: 12px;
  margin-bottom: 15px;
}
.plan-banner button {
  display: block;
  font-size: 13px;
  margin-top: 6px;
}
.save-choice {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  min-height: 48px;
}
.save-choice input {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
.review-moves {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  max-height: 250px;
  overflow: auto;
}
.review-moves button {
  width: 100%;
  padding: 8px;
}
.review-moves .active {
  background: var(--soft);
  border-color: var(--green);
}
.storage-alert {
  max-width: 1176px;
  margin: 16px auto;
  color: #9c411f;
  padding: 15px;
  background: #fff2df;
}
.data-controls {
  align-items: flex-start;
  gap: 16px;
}
.data-controls > div {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 1100px) {
  .plan-layout {
    grid-template-columns: 1fr 1fr;
  }
  .calendar {
    padding: 12px;
  }
  .weekdays,
  .calendar-grid {
    gap: 3px;
  }
  .lesson-grid,
  .archive-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .checklist {
    padding: 18px;
  }
  .task {
    padding: 10px;
    gap: 8px;
  }
}
@media (max-width: 900px) {
  .plan-layout {
    grid-template-columns: 1fr;
  }
  .calendar-grid {
    grid-template-columns: repeat(7, minmax(48px, 1fr));
  }
  .training-plan .section-head {
    flex-wrap: wrap;
  }
  .calendar-day {
    min-height: 75px;
  }
}
@media (max-width: 740px) {
  .lesson-grid,
  .archive-list {
    grid-template-columns: 1fr;
  }
  .board-wrap {
    min-width: 384px;
  }
  .data-controls {
    flex-direction: column;
  }
  .calendar {
    overflow-x: auto;
  }
  .weekdays,
  .calendar-grid {
    min-width: 372px;
  }
  .task {
    min-height: 72px;
  }
  .stats {
    margin-top: 20px;
  }
}

    0,-15,  0,  0,  0,  0,  0,-16,  0,  0,  0,  0,  0,-17,  0, 0,
  -15,  0,  0,  0,  0,  0,  0,-16,  0,  0,  0,  0,  0,  0,-17
];

const SHIFTS = { p: 0, n: 1, b: 2, r: 3, q: 4, k: 5 }

const BITS = {
  NORMAL: 1,
  CAPTURE: 2,
  BIG_PAWN: 4,
  EP_CAPTURE: 8,
  PROMOTION: 16,
  KSIDE_CASTLE: 32,
  QSIDE_CASTLE: 64,
}

const RANK_1 = 7
const RANK_2 = 6
const RANK_3 = 5
const RANK_4 = 4
const RANK_5 = 3
const RANK_6 = 2
const RANK_7 = 1
const RANK_8 = 0

// prettier-ignore
const SQUARE_MAP = {
  a8:   0, b8:   1, c8:   2, d8:   3, e8:   4, f8:   5, g8:   6, h8:   7,
  a7:  16, b7:  17, c7:  18, d7:  19, e7:  20, f7:  21, g7:  22, h7:  23,
  a6:  32, b6:  33, c6:  34, d6:  35, e6:  36, f6:  37, g6:  38, h6:  39,
  a5:  48, b5:  49, c5:  50, d5:  51, e5:  52, f5:  53, g5:  54, h5:  55,
  a4:  64, b4:  65, c4:  66, d4:  67, e4:  68, f4:  69, g4:  70, h4:  71,
  a3:  80, b3:  81, c3:  82, d3:  83, e3:  84, f3:  85, g3:  86, h3:  87,
  a2:  96, b2:  97, c2:  98, d2:  99, e2: 100, f2: 101, g2: 102, h2: 103,
  a1: 112, b1: 113, c1: 114, d1: 115, e1: 116, f1: 117, g1: 118, h1: 119
};

const ROOKS = {
  w: [
    { square: SQUARE_MAP.a1, flag: BITS.QSIDE_CASTLE },
    { square: SQUARE_MAP.h1, flag: BITS.KSIDE_CASTLE },
  ],
  b: [
    { square: SQUARE_MAP.a8, flag: BITS.QSIDE_CASTLE },
    { square: SQUARE_MAP.h8, flag: BITS.KSIDE_CASTLE },
  ],
}

const PARSER_STRICT = 0
const PARSER_SLOPPY = 1

/* this function is used to uniquely identify ambiguous moves */
function get_disambiguator(move, moves) {
  var from = move.from
  var to = move.to
  var piece = move.piece

  var ambiguities = 0
  var same_rank = 0
  var same_file = 0

  for (var i = 0, len = moves.length; i < len; i++) {
    var ambig_from = moves[i].from
    var ambig_to = moves[i].to
    var ambig_piece = moves[i].piece

    /* if a move of the same piece type ends on the same to square, we'll
     * need to add a disambiguator to the algebraic notation
     */
    if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
      ambiguities++

      if (rank(from) === rank(ambig_from)) {
        same_rank++
      }

      if (file(from) === file(ambig_from)) {
        same_file++
      }
    }
  }

  if (ambiguities > 0) {
    /* if there exists a similar moving piece on the same rank and file as
     * the move in question, use the square as the disambiguator
     */
    if (same_rank > 0 && same_file > 0) {
      return algebraic(from)
    } else if (same_file > 0) {
      /* if the moving piece rests on the same file, use the rank symbol as the
       * disambiguator
       */
      return algebraic(from).charAt(1)
    } else {
      /* else use the file symbol */
      return algebraic(from).charAt(0)
    }
  }

  return ''
}

function infer_piece_type(san) {
  var piece_type = san.charAt(0)
  if (piece_type >= 'a' && piece_type <= 'h') {
    var matches = san.match(/[a-h]\d.*[a-h]\d/)
    if (matches) {
      return undefined
    }
    return PAWN
  }
  piece_type = piece_type.toLowerCase()
  if (piece_type === 'o') {
    return KING
  }
  return piece_type
}

// parses all of the decorators out of a SAN string
function stripped_san(move) {
  return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
}

/*****************************************************************************
 * UTILITY FUNCTIONS
 ****************************************************************************/
function rank(i) {
  return i >> 4
}

function file(i) {
  return i & 15
}

function algebraic(i) {
  var f = file(i),
    r = rank(i)
  return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
}

function swap_color(c) {
  return c === WHITE ? BLACK : WHITE
}

function is_digit(c) {
  return '0123456789'.indexOf(c) !== -1
}

function clone(obj) {
  var dupe = obj instanceof Array ? [] : {}

  for (var property in obj) {
    if (typeof property === 'object') {
      dupe[property] = clone(obj[property])
    } else {
      dupe[property] = obj[property]
    }
  }

  return dupe
}

function trim(str) {
  return str.replace(/^\s+|\s+$/g, '')
}

/***************************************************************************
 * PUBLIC CONSTANTS
 **************************************************************************/

const BLACK = 'b'
const WHITE = 'w'

const EMPTY = -1

const PAWN = 'p'
const KNIGHT = 'n'
const BISHOP = 'b'
const ROOK = 'r'
const QUEEN = 'q'
const KING = 'k'

const SQUARES = (function () {
  /* from the ECMA-262 spec (section 12.6.4):
   * "The mechanics of enumerating the properties ... is
   * implementation dependent"
   * so: for (var sq in SQUARES) { keys.push(sq); } might not be
   * ordered correctly
   */
  var keys = []
  for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
    if (i & 0x88) {
      i += 7
      continue
    }
    keys.push(algebraic(i))
  }
  return keys
})()

const FLAGS = {
  NORMAL: 'n',
  CAPTURE: 'c',
  BIG_PAWN: 'b',
  EP_CAPTURE: 'e',
  PROMOTION: 'p',
  KSIDE_CASTLE: 'k',
  QSIDE_CASTLE: 'q',
}

const Chess = function (fen) {
  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}
  var comments = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    comments = {}
    update_setup(generate_fen())
  }

  function prune_comments() {
    var reversed_history = []
    var current_comments = {}
    var copy_comment = function (fen) {
      if (fen in comments) {
        current_comments[fen] = comments[fen]
      }
    }
    while (history.length > 0) {
      reversed_history.push(undo_move())
    }
    copy_comment(generate_fen())
    while (reversed_history.length > 0) {
      make_move(reversed_history.pop())
      copy_comment(generate_fen())
    }
    comments = current_comments
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARE_MAP[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square',
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(parseInt(tokens[5])) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(parseInt(tokens[4])) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARE_MAP.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARE_MAP[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARE_MAP)) {
      return false
    }

    var sq = SQUARE_MAP[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARE_MAP[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type,
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

    return attacked(swap_color(color), kings[color])

    return king_attacked(turn)

    return in_check() && generate_moves().length === 0
  }

    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {

          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag

          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++

    turn = swap_color(turn)

  function undo_move() {
    var old = history.pop()
    if (old == null) {

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {

      } else {

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {

        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {

    // the move parsers is a 2-step state

        // notations. This parser is opt-in (by specifying the
        // '{ sloppy: true }' setting) and is only run after the Standard
        // Algebraic Notation (SAN) parser has failed.
        //

        // the to/from square, and an optional promotion piece. This regex will
        // parse common non-standard notation like: Pe2-e4, Rc1c4, Qf3xf7,
        // f7f8q, b1c3

        // NOTE: Some positions and moves may be ambiguous when using the
        // sloppy parser. For example, in this position:
        // 6k1/8/8/B7/8/8/8/BN4K1 w - - 0 1, the move b1c3 may be interpreted
        // as Nc3 or B1c3 (a disambiguated bishop move). In these cases, the
        // sloppy parser will default to the most most basic interpretation
        // (which is b1c3 parsing to Nc3).

          var from = matches[2]
          var to = matches[3]
          var promotion = matches[4]

            overly_disambiguated = true

          // be overly disambiguated (e.g. Nge7 is unnecessary and non-standard
          // when there is one legal knight move to e7). In this case, the value
          // of 'from' variable will be a rank or file, not a square.
          var matches = clean_move.match(
            /([pnbrqkPNBRQK])?([a-h]?[1-8]?)x?-?([a-h][1-8])([qrbnQRBN])?/
          )

          if (matches) {
            var piece = matches[1]
            var from = matches[2]
            var to = matches[3]
            var promotion = matches[4]

            if (from.length == 1) {
              var overly_disambiguated = true
            }
          }
        }
      }

      var piece_type = infer_piece_type(clean_move)
      var moves = generate_moves({
        legal: true,
        piece: piece ? piece : piece_type,

      for (var i = 0, len = moves.length; i < len; i++) {
        switch (parser) {
          case PARSER_STRICT: {
            if (clean_move === stripped_san(move_to_san(moves[i], moves))) {

              // regex
              if (
                (!piece || piece.toLowerCase() == moves[i].piece) &&
                SQUARE_MAP[from] == moves[i].from &&
                SQUARE_MAP[to] == moves[i].to &&
                (!promotion || promotion.toLowerCase() == moves[i].promotion)
              ) {
                return moves[i]
              } else if (overly_disambiguated) {
                // SPECIAL CASE: we parsed a move string that may have an
                // unneeded rank/file disambiguator (e.g. Nge7).  The 'from'
                // variable will
                var square = algebraic(moves[i].from)
                if (
                  (!piece || piece.toLowerCase() == moves[i].piece) &&
                  SQUARE_MAP[to] == moves[i].to &&

                }
              }
            }
          }
        }
      }
    }

    return null
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {

    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {

  /*****************************************************************************
   * DEBUGGING UTILITIES

  function perft(depth) {

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes

    return nodes

  return {

       * unnecessary move keys resulting from a verbose call.
       */

          'verbose' in options &&
          options.verbose

          moves.push(make_pretty(ugly_moves[i]))
        } else {

            move_to_san(ugly_moves[i], generate_moves({ legal: true }))

    },

    in_check: function () {
      return in_check()
    },

    in_checkmate: function () {
      return in_checkmate()
    },

    in_stalemate: function () {
      return in_stalemate()
    },

    in_draw: function () {

        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()

    },

    insufficient_material: function () {
      return insufficient_material()
    },

    in_threefold_repetition: function () {
      return in_threefold_repetition()
    },

    game_over: function () {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()

    validate_fen: function (fen) {

    fen: function () {

    board: function () {

        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({
            square: algebraic(i),
            type: board[i].type,
            color: board[i].color,
          })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

<script>
// Depth is measured in half-moves; all levels intentionally remain beginner strength.
const AI_LEVELS = [
  null,
  { name: "小蜗牛 · 陪我试试", depth: 0, noise: 0, blunder: 1 },
  { name: "小兔子 · 看看吃子", depth: 1, noise: 220, blunder: 0.5 },
  { name: "小松鼠 · 想一小步", depth: 1, noise: 140, blunder: 0.35 },
  { name: "小海豚 · 多看一眼", depth: 2, noise: 90, blunder: 0.24 },
  { name: "小狮子 · 小小挑战", depth: 2, noise: 45, blunder: 0.15 },
];
const values = { p: 100, n: 300, b: 310, r: 500, q: 900, k: 0 };
function evaluate(g, side) {
  if (g.in_checkmate()) return g.turn() === side ? -100000 : 100000;
  if (g.in_draw()) return 0;
  let score = 0;
  g.board().forEach((rank, r) =>
    rank.forEach((p, f) => {
      if (p)
        score +=
          (p.color === side ? 1 : -1) *
          (values[p.type] +
            (p.type === "p" ? (p.color === "w" ? 6 - r : r - 1) * 6 : 0) +
            (["n", "b"].includes(p.type) ? (3.5 - Math.abs(3.5 - f)) * 6 : 0));
    }),
  );
  return score;
}
function search(g, depth, side, alpha = -Infinity, beta = Infinity) {
  if (!depth || g.game_over()) return evaluate(g, side);
  const maximizing = g.turn() === side;
  let best = maximizing ? -Infinity : Infinity;
  for (const m of g
    .moves({ verbose: true })
    .sort((a, b) => (values[b.captured] || 0) - (values[a.captured] || 0))) {
    g.move(m);
    const score = search(g, depth - 1, side, alpha, beta);
    g.undo();
    best = maximizing ? Math.max(best, score) : Math.min(best, score);
    if (maximizing) alpha = Math.max(alpha, best);
    else beta = Math.min(beta, best);
    if (beta <= alpha) break;
  }
  return best;
}
function chooseMove(g, level = 5, deterministic = false, rng = Math.random) {
  const moves = g.moves({ verbose: true });
  if (!moves.length) return null;
  const cfg = AI_LEVELS[Math.max(1, Math.min(5, Number(level) || 1))];
  const random = (list) =>
    list[Math.min(list.length - 1, Math.floor(rng() * list.length))];
  if (cfg.depth === 0 && !deterministic) {
    const captures = moves.filter((m) => m.captured);
    return random(captures.length ? captures : moves);
  }
  if (!deterministic && rng() < cfg.blunder) return random(moves);
  const side = g.turn();
  let best = -Infinity,
    choice = moves[0];
  for (const m of moves) {
    g.move(m);
    const score =
      search(g, Math.max(1, cfg.depth) - 1, side) +
      (g.in_check() ? 15 : 0) +
      (deterministic ? 0 : (rng() - 0.5) * cfg.noise);
    g.undo();
    if (score > best) {
      best = score;
      choice = m;
    }
  }
  return choice;
}

<script>
// Keep the v1 key: upgrading must preserve the child's existing progress.
const KEY = "xiaoba-chess-v1";
const $ = (selector) => document.querySelector(selector);
function localDate(date = new Date()) {
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0"),
  ].join("-");
}
function fresh() {
  return {
    version: 2,
    solved: [],
    correct: 0,
    attempts: 0,
    streak: 0,
    best: 0,
    practice: [],
    wins: 0,
    losses: 0,
    draws: 0,
    queue: [],
    cursor: 0,
    theme: "light",
    muted: false,
    level: 1,
    games: [],
    saveGames: true,
    lessonDone: [],
    events: [],
    planStart: localDate(),
    reviewed: [],
  };
}
function migrateState(input) {
  const defaults = fresh(),
    s = {
      ...defaults,
      ...(input && typeof input === "object" && !Array.isArray(input)
        ? input
        : {}),
    };
  for (const key of ["solved", "practice", "queue", "lessonDone", "reviewed"])
    s[key] = Array.isArray(s[key])
      ? [...new Set(s[key].filter((x) => typeof x === "string"))]
      : [];
  s.games = Array.isArray(s.games)
    ? s.games.filter(

    sound("wrong");
    selected = null;
    hint = [];
    $("#status").innerHTML = `<b>再想一想，你可以的。</b>${current.retry}`;
    drawBoard();
    return;
  }
  const m = game.move(move);
  if (!m) return;
  last = [m.from, m.to];
  selected = null;
  hint = [];
  answered = true;
  sound("win");
  drawBoard();
  $("#board").classList.add("success");
  const kind =
      mode === "puzzles" ? "puzzle" : mode === "lesson" ? "lesson" : "practice",
    evidenceId = kind === "lesson" ? LESSONS[lessonIndex].id : current.id;
  if (!assisted) {
    noteCompletion(kind, evidenceId);
    // Preview and sessions crossing midnight advance without backdating evidence.
    if (
      planSession?.task.kind === kind &&
      planSession.task.items.includes(evidenceId)
    ) {
      planSession.visited ||= [];
      if (!planSession.visited.includes(evidenceId))
        planSession.visited.push(evidenceId);
    }
  }
  const coached = assisted
    ? "<p>这是跟提示完成的；重新进入任务独立做一次，才能打勾。</p>"
    : "";
  if (mode === "practice") {
    if (!state.practice.includes(current.id)) state.practice.push(current.id);
    save();
    const complete = GROUPS[groupIndex].items.every((x) =>
      state.practice.includes(x.id),
    );
    $("#status").innerHTML =
      `<b>太棒了，闯关成功！</b>${complete ? "🏅 已获得「" + GROUPS[groupIndex].badge + "」徽章。" : current.explain}${coached}<button class="primary" onclick="${planSession && assisted ? "retryIndependently()" : "nextPractice()"}">${planSession && assisted ? "重新独立挑战" : "继续 →"}</button>`;
  } else if (mode === "lesson") {
    if (!assisted && !state.lessonDone.includes(evidenceId))
      state.lessonDone.push(evidenceId);
    save();
    $("#status").innerHTML =
      `<b>你学会了一个小本领！</b>${current.explain}${coached}<button class="primary" onclick="${assisted ? "retryIndependently()" : planSession ? "nextPlanItem()" : "navigate('learn')"}">${assisted ? "重新独立挑战" : "完成，继续 →"}</button>`;
  } else {
    if (!wrong && !assisted) {
      state.attempts++;
      state.correct++;
      state.streak++;
      state.best = Math.max(state.best, state.streak);
    }
    if (!state.solved.includes(current.id)) state.solved.push(current.id);
    if (!planSession) state.cursor++;
    save();
    $("#status").innerHTML =
      `<b>找到了，真棒！</b>${coached}${planSession && assisted ? '<button onclick="retryIndependently()">重新独立挑战</button>' : "马上进入下一题…"}`;
    if (!(planSession && assisted)) {
      const token = epoch;
      timer = setTimeout(() => {
        if (epoch === token) startPuzzle();
      }, 1500);
    }
  }
}
function giveHint() {
  if (ended || busy || answered || lessonDemo || mode === "review") return;
  if (["practice", "puzzles", "lesson"].includes(mode)) {
    countPuzzleAttempt();
    assisted = true;
    hint = [current.solution.slice(0, 2)];
    $("#status").innerHTML = "<b>给你一个小线索</b>" + current.hint;
    drawBoard();
    return;
  }
  const m = chooseMove(game, 5, true);
  if (m) {
    hint = [m.from, m.to];
    selected = null;
    drawBoard();
  }
}
function showAnswer() {
  if (answered || busy || lessonDemo) return;
  countPuzzleAttempt();
  assisted = true;
  busy = true;
  hint = [current.solution.slice(0, 2), current.solution.slice(2, 4)];
  drawBoard();
  $("#status").innerHTML = "<b>一起看看这一步</b>" + current.hint;
  const token = epoch;
  timer = setTimeout(() => {
    if (token !== epoch) return;
    const s = current.solution,
      m = game.move({
        from: s.slice(0, 2),
        to: s.slice(2, 4),
        promotion: s[4],
      });
    last = [m.from, m.to];
    hint = [];
    drawBoard();
    sound("move");
    $("#status").innerHTML =
      "<b>这就是关键的一步。</b>" +
      current.explain +
      '<button class="primary" onclick="retryExercise()">跟着再试一遍</button>';
    busy = false;
    answered = true;
  }, 900);
}
function retryExercise() {
  stop();
  startExercise();
  assisted = true;
}
function retryIndependently() {
  stop();
  startExercise();
}

</script>
<script>
function earnedBadges() {

}
function badgeHTML() {

}
function home() {

    total = GROUPS.reduce((n, g) => n + g.items.length, 0);
  $("#app").innerHTML =
    `<section class="hero"><div><div class="eyebrow">小棋手，欢迎回来</div><h1>每天一点点，下出好一步。</h1><p>先找将军，再看吃子。今天的小任务已经准备好啦。</p></div><div class="hero-art" aria-hidden="true">♜ ♞ ♔</div></section>${calendarHTML()}<section class="stats"><div class="stat"><span>我的徽章</span><b>${earnedBadges().length} <small>/ ${GROUPS.length}</small></b><span>每完成一个主题，点亮一枚</span></div><div class="stat"><span>解开的谜题</span><b>${state.solved.length} <small>/ ${PUZZLES.length}</small></b><span>首次作答正确率 ${state.attempts ? Math.round((state.correct / state.attempts) * 100) : 0}%</span></div><div class="stat"><span>人机对弈战绩</span><b>${state.wins} <small>胜</small></b><span>${state.losses} 负 · ${state.draws} 和 · ${state.games.length} 盘收藏</span></div><div class="stat"><span>主题练习进度</span><b>${completed} <small>/ ${total}</small></b><span>课堂 ${state.lessonDone.length} / ${LESSONS.length} · 最长连对 ${state.best} 题</span></div></section><section class="cards"><article class="card"><div class="icon">♞</div><span class="pill">轻松下一盘</span><h2>和小棋友过招</h2><p>从小蜗牛开始。每盘棋默认收藏，方便和家长复盘。</p><button class="primary" onclick="navigate('ai')">开始人机对弈 →</button><button onclick="navigate('archive')">我的棋局与复盘</button></article><article class="card"><div class="icon">⚑</div><span class="pill">${GROUPS.length} 个训练主题</span><h2>收集棋士徽章</h2><p>杀法和战术，${total} 个小关卡慢慢练。</p><button onclick="navigate('practice')">自由练习 →</button><button onclick="navigate('puzzles')">${PUZZLES.length} 道谜题</button></article><article class="card"><div class="icon">▤</div><span class="pill">开局 · 中局 · 残局</span><h2>学一个小本领</h2><p>每课三个提醒、一步示范和一道独立挑战。</p><button onclick="navigate('learn')">进入学习小课堂 →</button><button onclick="navigate('local')">和家长下一盘</button></article></section>${badgeHTML()}<div class="section-head data-controls"><span class="sub">${storageOK ? "记录保存在当前浏览器，请定期导出备份。" : "当前无法保存记录，请导出备份。"}</span><div><button onclick="downloadJSON()">导出进度备份</button><button onclick="ask('重新开始旅程？','这会清空本浏览器的徽章、谜题、训练计划和棋局收藏。请先导出备份。',()=>{state=fresh();activeGameId=null;selectedPlanDate=null;save();applySettings();navigate('home')})">清空数据重新开始</button></div></div>`;
}

<script>
"use strict";
let mode = "home",
  game = new Chess(),
  human = "w",
  flipped = false,
  selected = null,
  hint = [],
  timer = null,
  epoch = 0,
  busy = false,
  ended = false,
  recorded = false,
  current = null,
  groupIndex = 0,
  practiceIndex = 0,
  answered = false,
  assisted = false,
  wrong = false,
  message = "",
  last = [];
const pieceNames = { k: "王", q: "后", r: "车", b: "象", n: "马", p: "兵" };
// 可调整的弱 AI 参数：depth 为半回合深度，noise 为随机噪声，blunder 为随机走子概率。
function stop() {
  epoch++;
  clearTimeout(timer);
  busy = false;
  $("#promotion").close();
  selected = null;
  hint = [];
}
function ask(title, text, fn) {
  $("#confirmTitle").textContent = title;
  $("#confirmText").textContent = text;
  $("#confirmYes").onclick = () => {
    $("#confirm").close();
    fn();
  };
  $("#confirm").showModal();
}
function toggleTheme() {
  state.theme = state.theme === "light" ? "dark" : "light";
  applySettings();
  save();
}
function toggleSound() {
  state.muted = !state.muted;
  applySettings();
  save();
}
function applySettings() {
  document.body.classList.toggle("dark", state.theme === "dark");
  $("#theme").textContent = state.theme === "dark" ? "☀ 浅色" : "☾ 深色";
  $("#sound").textContent = state.muted ? "♪ 已静音" : "♪ 声音开";
}
let audio;
function sound(kind = "move") {
  if (state.muted) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    const notes = {
      move: [390],
      capture: [260, 420],
      check: [490, 620],
      win: [523, 659, 784],
      lose: [392, 330, 262],
      wrong: [220, 190],
    }[kind] || [390];
    notes.forEach((f, i) => {
      const o = audio.createOscillator(),
        g = audio.createGain(),
        t = audio.currentTime + i * 0.11;
      o.type = "sine";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.11, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t);
      o.stop(t + 0.17);
    });
  } catch {}
}
function navigate(next) {
  snapshotGame();
  stop();
  clearPlanSession();
  mode = next;
  renderNav();
  if (next === "home") home();
  else if (next === "practice") practiceHome();
  else if (next === "puzzles") startPuzzle();
  else if (next === "archive") archiveHome();
  else if (next === "learn") learnHome();
  else newGame();
}
function renderNav() {
  const names = {
    home: "⌂ 我的旅程",
    ai: "♟ 人机对弈",
    practice: "⚑ 主题练习",
    puzzles: "✦ 每日谜题",
    local: "♜ 亲子对弈",
    learn: "▤ 学习小课堂",
    archive: "↺ 棋局复盘",
  };
  $("#nav").innerHTML = Object.entries(names)
    .map(
      ([k, v]) =>
        `<button class="${mode === k ? "active" : ""}" onclick="navigate('${k}')">${v}</button>`,
    )
    .join("");
}
function newGame() {
  snapshotGame();
  stop();
  activeGameId = makeId();
  keepCurrentGame = state.saveGames;
  game = new Chess();
  ended = recorded = answered = false;
  last = [];
  message = "";
  flipped = human === "b" && mode === "ai";
  renderGame();
  maybeAI();
}
function layout(title, body) {
  $("#app").innerHTML =
    `<div class="play-layout"><section class="board-wrap"><div class="player"><span id="topPlayer"></span><span class="sub" id="topLabel"></span></div><div id="board" class="board" aria-label="国际象棋棋盘"></div><div class="player"><span id="bottomPlayer"></span><span class="sub">点棋子，再点目标格</span></div></section><aside class="panel"><div class="eyebrow">小八的训练营</div><h1>${title}</h1>${body}</aside></div>`;
  drawBoard();
}
function renderGame() {
  layout(
    mode === "ai" ? "和小棋友下一盘" : "一起下盘棋",
    `${
      mode === "ai"
        ? `<label for="difficulty">小棋友的难度</label><select id="difficulty" onchange="state.level=+this.value;save()">${AI_LEVELS.slice(
            1,
          )
            .map(
              (cfg, i) =>
                `<option value="${i + 1}" ${state.level === i + 1 ? "selected" : ""}>${i + 1} 级 · ${cfg.name}</option>`,
            )
            .join("")}</select>`
        : "<p>家长和孩子轮流点击走子。</p>"
    }<div id="status" class="status" role="status" aria-live="polite"></div><div class="controls"><button onclick="undo()">↶ 悔棋</button><button onclick="giveHint()">☀ 提示</button><button onclick="resign()">认输</button><button onclick="${mode === "ai" ? "ask('交换黑白？','将重新开局，由白棋先走。',()=>{human=human==='w'?'b':'w';newGame()})" : "flipped=!flipped;drawBoard()"}">${mode === "ai" ? "⇄ 换边" : "⇅ 翻转棋盘"}</button><button class="wide primary" onclick="ask('重新开局？','当前这盘将结束，不计入战绩。',newGame)">重新开局</button></div>${mode === "ai" ? `<label class="save-choice"><input type="checkbox" ${keepCurrentGame ? "checked" : ""} onchange="setKeepCurrent(this.checked)"> 自动保留这盘棋，方便以后复盘</label><button onclick="navigate('archive')">查看我的棋局</button>` : ""}<div id="moves" class="moves"></div><p class="tip">${mode === "ai" ? "小提醒：先照顾好自己的王，再看看对手有没有没保护的棋子。" : "小提醒：轮到谁，就由谁点击棋子。可以随时翻转棋盘。"}</p>`,
  );
  updateGameStatus();
}
function drawBoard() {
  if (!$("#board")) return;
  const files = flipped ? "hgfedcba" : "abcdefgh",
    ranks = flipped ? [1, 2, 3, 4, 5, 6, 7, 8] : [8, 7, 6, 5, 4, 3, 2, 1],
    legal = selected ? game.moves({ square: selected, verbose: true }) : [];
  let out = "";
  for (let ri = 0; ri < 8; ri++)
    for (let fi = 0; fi < 8; fi++) {
      const sq = files[fi] + ranks[ri],
        p = game.get(sq),
        dark = (sq.charCodeAt(0) - 97 + ranks[ri]) % 2 === 1,
        dest = legal.some((m) => m.to === sq);
      out += `<button class="sq ${dark ? "dark-square" : ""} ${last.includes(sq) ? "last" : ""} ${selected === sq ? "selected" : ""} ${hint.includes(sq) ? "hint" : ""} ${p && p.type === "k" && p.color === game.turn() && game.in_check() ? "check" : ""}" aria-label="${sq}${p ? " " + (p.color === "w" ? "白" : "黑") + pieceNames[p.type] : " 空格"}" onclick="clickSquare('${sq}')">${p ? PIECE_SVGS[p.color + p.type.toUpperCase()] : ""}${dest ? `<span class="${p ? "ring" : "dot"}"></span>` : ""}${fi === 0 ? `<span class="coord rank">${ranks[ri]}</span>` : ""}${ri === 7 ? `<span class="coord file">${files[fi]}</span>` : ""}</button>`;
    }
  $("#board").innerHTML = out;
  const top = flipped ? "w" : "b",
    bottom = flipped ? "b" : "w",
    name = (c) =>
      `${c === "w" ? "○ 白棋" : "● 黑棋"}${mode === "ai" ? (c === human ? " · 你" : " · 小棋友") : ""}`;
  $("#topPlayer").textContent = name(top);
  $("#bottomPlayer").textContent = name(bottom);
  $("#topLabel").textContent =
    mode === "ai"
      ? "友好对弈"
      : mode === "local"
        ? "亲子时光"
        : "仔细观察，慢慢思考";
}
function clickSquare(sq) {
  if (mode === "review" || lessonDemo || busy || ended || answered) return;
  if (mode === "ai" && game.turn() !== human) return;
  const p = game.get(sq);
  if (selected) {
    const opts = game
      .moves({ square: selected, verbose: true })
      .filter((m) => m.to === sq);
    if (opts.length) {
      if (opts.some((m) => m.promotion)) {
        const from = selected;
        $("#promoteChoices").innerHTML = ["q", "r", "b", "n"]
          .map(
            (t) =>
              `<button aria-label="升变为${pieceNames[t]}" onclick="$('#promotion').close();attemptMove({from:'${from}',to:'${sq}',promotion:'${t}'})">${PIECE_SVGS[game.turn() + t.toUpperCase()]}</button>`,
          )
          .join("");
        $("#promotion").showModal();
        $("#promoteChoices button").focus();
        return;
      }
      attemptMove(opts[0]);
      return;
    }
  }
  selected = p && p.color === game.turn() ? sq : null;
  hint = [];
  drawBoard();
}
function attemptMove(move) {
  if (mode === "review" || lessonDemo || busy || ended || answered) return;
  if (["practice", "puzzles", "lesson"].includes(mode)) {
    solveExercise(move);
    return;
  }
  performMove(move);
  maybeAI();
}
function performMove(move) {
  const m = game.move(move);
  if (!m) return;
  selected = null;
  hint = [];
  last = [m.from, m.to];
  if (!game.game_over())
    sound(game.in_check() ? "check" : m.captured ? "capture" : "move");
  drawBoard();
  updateGameStatus();
  snapshotGame();
}
function updateGameStatus() {
  if (!$("#status")) return;
  if (!ended && game.game_over()) {
    ended = true;
    const winner = game.in_checkmate()
      ? game.turn() === "w"
        ? "b"
        : "w"
      : null;
    message = winner
      ? `${winner === "w" ? "白棋" : "黑棋"}获胜！${mode === "ai" ? (winner === human ? "你做到了！" : "这盘积累了新经验。") : ""}`
      : "握握手，这是一盘和棋。";
    record(winner);
    sound(mode === "ai" && winner && winner !== human ? "lose" : "win");
  }
  $("#status").innerHTML = ended
    ? `<b>${message}</b><button class="primary" onclick="newGame()">再来一局 →</button>`
    : `<b>${busy ? "小棋友正在想一想…" : (game.turn() === "w" ? "白棋" : "黑棋") + "走棋" + (game.in_check() ? " · 注意，将军！" : "")}</b>${mode === "ai" ? (game.turn() === human ? "轮到你啦，找出想走的棋子。" : "稍等一下，小棋友马上落子。") : "点起点，再点终点。"}`;
  const history = game.history();
  if ($("#moves"))
    $("#moves").textContent = history.length
      ? history
          .map((m, i) => (i % 2 === 0 ? Math.floor(i / 2) + 1 + ". " : "") + m)
          .join(" ")
      : "棋谱会出现在这里";
}
function record(winner) {
  if (mode !== "ai" || recorded) return;
  recorded = true;
  state[winner === null ? "draws" : winner === human ? "wins" : "losses"]++;
  snapshotGame(
    winner === null ? "和棋" : winner === human ? "胜利" : "再接再厉",
  );
  save();
}
function undo() {
  if (ended) return;
  stop();
  if (!game.history().length) return;
  if (mode === "ai") {
    game.undo();
    if (game.turn() !== human && game.history().length) game.undo();
  } else game.undo();
  last = [];
  drawBoard();
  updateGameStatus();
  snapshotGame();
  maybeAI();
}
function resign() {
  if (ended) return;
  ask("确定认输吗？", "每一盘都是练习，下一盘再加油。", () => {
    const loser = mode === "ai" ? human : game.turn();
    stop();
    ended = true;
    message =
      (loser === "w" ? "白棋" : "黑棋") +
      "认输，" +
      (loser === "w" ? "黑棋" : "白棋") +
      "获胜。";
    record(loser === "w" ? "b" : "w");
    sound("lose");
    updateGameStatus();
  });
}
function maybeAI() {
  if (mode !== "ai" || ended || game.turn() === human) return;
  busy = true;
  updateGameStatus();
  const token = epoch;
  timer = setTimeout(() => {
    if (token !== epoch) return;
    const move = chooseMove(game, state.level);
    busy = false;
    if (move) performMove(move);
  }, 450);
}
function practiceHome() {
  current = null;
  $("#app").innerHTML =
    `<section class="hero"><div><div class="eyebrow">主题练习 · 一步一个小成就</div><h1>收集二十枚棋士徽章</h1><p>先看目标，再找机会。走错也没关系，可以再试一次。</p></div><div class="hero-art">⚑</div></section><section class="cards practice-grid">${GROUPS.map((g, i) => `<article class="card"><span class="pill">主题 ${String(i + 1).padStart(2, "0")} · ${g.items.length} 关</span><h2 style="margin-top:14px">${g.title}</h2><p>${g.description}</p><div class="progress"><i style="width:${(g.items.filter((x) => state.practice.includes(x.id)).length / g.items.length) * 100}%"></i></div><div class="sub">${g.items.filter((x) => state.practice.includes(x.id)).length} / ${g.items.length} 已完成 · ${g.badge}</div><div class="levels">${g.items.map((x, j) => `<button onclick="startPractice(${i},${j})" aria-label="第${j + 1}关 ${x.title}">${state.practice.includes(x.id) ? "✓" : j + 1}</button>`).join("")}</div></article>`).join("")}</section>`;
}

</script>

applySettings();
navigate("home");
if (location.protocol === "file:")
  document.querySelector("#offlineDownload")?.remove();
